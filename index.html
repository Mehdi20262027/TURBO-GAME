.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,input{font:inherit}
.b{font-weight:800;font-size:16px;padding:10px 20px;border:2px solid transparent;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2f7bff,#7a4dff);cursor:pointer}
.b.o{background:linear-gradient(135deg,#ff8a2a,#ff4d6d)}.b.g{background:#2a3358}
.b.sel{border-color:#ffd34d}.b:disabled{opacity:.4;cursor:default}

.big{font-size:42px;font-weight:900;letter-spacing:8px;direction:ltr}
small{opacity:.75;line-height:1.7;font-size:12px}
.hidden{display:none!important}

</head>

// ===== physics
function stepCar(c,u,dt){let fx=Math.sin(c.yaw),fz=Math.cos(c.yaw);const G=c.p.y<=CY+.03;

c.vf=c.v.x*fx+c.v.z*fz;
for(const p of pads)if(p.t<=0&&Math.abs(p.x-c.p.x)<10&&Math.abs(p.z-c.p.z)<10&&c.p.y<6){c.boost=Math.min(100,c.boost+p.v);p.t=6}}
const tmp=new V();

const pk=c=>[+c.p.x.toFixed(1),+c.p.y.toFixed(1),+c.p.z.toFixed(1),+c.yaw.toFixed(3),+c.v.x.toFixed(1),+c.v.y.toFixed(1),+c.v.z.toFixed(1),Math.round(c.boost),c.boosting?1:0,+Math.max(0,c.flipT).toFixed(2),c.flipD,c.idx];

// ===== render
function drawCar(c,x,y,z,yaw,fl,bo,vf,idx,dt){c.mods.forEach((m,k)=>m.g.visible=k===idx);const m=c.mods[idx];

if(!menu){$('sb').textContent=score[0];$('so').textContent=score[1];const tt=Math.ceil(timer);$('tm').textContent=ot?'OT':Math.floor(tt/60)+':'+String(tt%60).padStart(2,'0');$('bf').style.width=me.boost+'%';$('sv').textContent=Math.round(sp*.9)}

let ballV;let last=performance.now(),acc=0,fc=0,ft0=last;const dt0=1/120;

updP(fr);netSend(n);render(fr,n);R.render(scene,cam);
